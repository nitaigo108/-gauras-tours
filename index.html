<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gauras Tours | Rishikesh & Vrindavan</title>

  <meta
    name="description"
    content="A sacred journey through Rishikesh and Vrindavan, India. November 8–19, 2026. Yoga, kirtan, temples, sacred rivers, seva and spiritual community."
  >

  <link rel="icon" href="favicon.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #253b38;
      background: #fffdf8;
      line-height: 1.6;
    }

    body.modal-open {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1120px, 90%);
      margin: 0 auto;
    }

    /* NAVIGATION */

    .nav {
      background: rgba(255, 253, 248, 0.97);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(37, 59, 56, 0.1);
      backdrop-filter: blur(10px);
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #253b38;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand strong {
      display: block;
      font-size: 23px;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    .brand small {
      display: block;
      font-family: Arial, sans-serif;
      color: #77817e;
      font-size: 10px;
      margin-top: 1px;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .nav-links a {
      color: #334b47;
    }

    .menu-btn {
      display: none;
      border: none;
      background: transparent;
      font-size: 28px;
      color: #253b38;
      cursor: pointer;
    }

    /* BUTTONS */

    .btn {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 999px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: #2c6c65;
      color: white !important;
    }

    .btn-primary:hover {
      background: #245a55;
      transform: translateY(-1px);
    }

    .btn-gold {
      background: #e9bd76;
      color: #253b38;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .btn-gold:hover {
      background: #f2cb8d;
      transform: translateY(-2px);
    }

    .btn-light {
      color: white;
      border: 1px solid rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.08);
    }

    /* HERO */

    .hero {
      min-height: calc(100vh - 76px);
      position: relative;
      display: flex;
      align-items: flex-end;

      background-image:
        linear-gradient(
          90deg,
          rgba(13,38,37,0.72) 0%,
          rgba(13,38,37,0.42) 48%,
          rgba(13,38,37,0.10) 100%
        ),
        linear-gradient(
          0deg,
          rgba(13,38,37,0.50) 0%,
          transparent 52%
        ),
        url("ganga-walk.jpg");

      background-size: cover;
      background-position: center;
      color: white;
    }

    .hero-content {
      max-width: 820px;
      padding: 115px 0 95px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 5px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #f2d8a3;
      margin-bottom: 17px;
    }

    .hero h1 {
      font-size: clamp(58px, 10vw, 112px);
      line-height: 0.86;
      font-weight: 400;
      letter-spacing: -2px;
      text-shadow: 0 4px 22px rgba(0,0,0,0.35);
    }

    .hero h1 span {
      display: block;
      margin-top: 10px;
    }

    .hero-script {
      display: block;
      font-style: italic;
      color: #f1c875;
      font-size: clamp(28px, 5vw, 48px);
      margin-top: 25px;
      letter-spacing: 1px;
    }

    .hero-tags {
      margin-top: 26px;
      font-family: Arial, sans-serif;
      color: #f4dfb4;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .hero-subtitle {
      max-width: 630px;
      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1.75;
      margin-top: 18px;
      color: rgba(255,255,255,0.96);
    }

    .hero-buttons {
      margin-top: 31px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* TOUR FACTS */

    .tour-facts {
      background: #274e49;
      color: white;
    }

    .facts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      max-width: 800px;
      margin: 0 auto;
    }

    .fact {
      padding: 27px 20px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.14);
    }

    .fact:last-child {
      border-right: 0;
    }

    .fact small {
      display: block;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #dfc99d;
      font-size: 10px;
      margin-bottom: 6px;
    }

    .fact strong {
      font-size: 18px;
      font-weight: 400;
    }

    /* GENERAL */

    .section {
      padding: 90px 0;
    }

    .section-alt {
      background: #f4efe5;
    }

    .section-title {
      max-width: 720px;
      margin-bottom: 45px;
    }

    .section-title.center {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .kicker {
      font-family: Arial, sans-serif;
      color: #b8733f;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 9px;
    }

    .section-title h2 {
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.1;
      font-weight: 400;
      color: #264b46;
    }

    .description {
      font-family: Arial, sans-serif;
      color: #65726f;
      margin-top: 16px;
      line-height: 1.8;
    }

    /* INTRO */

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 65px;
      align-items: center;
    }

    .intro-copy h2 {
      font-size: clamp(38px, 5vw, 56px);
      font-weight: 400;
      line-height: 1.12;
      margin-bottom: 22px;
      color: #264b46;
    }

    .intro-copy p {
      font-family: Arial, sans-serif;
      color: #5f6f6b;
      margin-bottom: 18px;
      font-size: 16px;
      line-height: 1.8;
    }

    .intro-photo img {
      min-height: 500px;
      height: 60vh;
      object-fit: cover;
      border-radius: 4px 80px 4px 4px;
    }

    /* INCLUDED */

    .include-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .include-card {
      background: white;
      border-radius: 14px;
      padding: 29px 22px;
      text-align: center;
      border: 1px solid rgba(39,78,73,0.08);
      box-shadow: 0 8px 28px rgba(37,59,56,0.05);
    }

    .include-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 17px;
      border-radius: 50%;
      background: #edf4ef;
      display: grid;
      place-items: center;
      font-size: 23px;
    }

    .include-card h3 {
      font-size: 18px;
      color: #264b46;
      margin-bottom: 10px;
    }

    .include-card p {
      font-family: Arial, sans-serif;
      color: #66736f;
      font-size: 13px;
      line-height: 1.6;
    }

    .airfare-note {
      max-width: 700px;
      margin: 28px auto 0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      text-align: center;
      color: #7b817d;
      font-style: italic;
    }

    /* DESTINATIONS */

    .destination-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .destination {
      min-height: 520px;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      color: white;
      background-size: cover;
      background-position: center;
    }

    .rishikesh {
      background-image:
        linear-gradient(to top, rgba(19,49,46,0.85), rgba(19,49,46,0.05)),
        url("riverside-kirtan.jpg");
    }

    .vrindavan {
      background-image:
        linear-gradient(to top, rgba(50,35,23,0.85), rgba(50,35,23,0.05)),
        url("vrindavan-real.jpg");
    }

    .destination-content {
      padding: 40px;
    }

    .destination-content small {
      font-family: Arial, sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f3d694;
    }

    .destination-content h3 {
      font-size: 45px;
      font-weight: 400;
      margin: 5px 0 8px;
    }

    .destination-content p {
      max-width: 440px;
      font-style: italic;
      font-size: 17px;
    }

    /* ITINERARY */

    .journey-list {
      max-width: 900px;
      margin: 0 auto;
    }

    .journey-day {
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 28px;
      padding: 27px 0;
      border-bottom: 1px solid #ded8cd;
    }

    .journey-day time {
      font-family: Arial, sans-serif;
      color: #b8733f;
      font-weight: 700;
      font-size: 14px;
      padding-top: 4px;
    }

    .journey-day h3 {
      color: #264b46;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .journey-day p {
      font-family: Arial, sans-serif;
      color: #66736f;
      font-size: 14px;
    }

    .daily-rhythm {
      margin: 0 auto 45px;
      max-width: 900px;
      background: #e7efe9;
      border-radius: 15px;
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      font-family: Arial, sans-serif;
      color: #35534e;
      text-align: center;
    }

    /* GALLERY */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .gallery-grid figure {
      overflow: hidden;
      border-radius: 10px;
      background: #eee;
    }

    .gallery-grid img {
      width: 100%;
      height: 390px;
      object-fit: cover;
    }

    .photo-disclaimer {
      max-width: 760px;
      margin: 22px auto 0;
      text-align: center;
      font-family: Arial, sans-serif;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    /* PACKING */

    .packing-list {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .packing-item {
      font-family: Arial, sans-serif;
      background: white;
      padding: 17px 20px;
      border-radius: 9px;
      color: #4d615d;
      border: 1px solid #ece6dc;
    }

    /* CTA */

    .cta {
      background:
        linear-gradient(rgba(27,59,55,0.83), rgba(27,59,55,0.83)),
        url("ganga-walk.jpg");
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 95px 0;
    }

    .cta h2 {
      font-size: clamp(43px, 6vw, 70px);
      font-weight: 400;
      line-height: 1.05;
    }

    .cta p {
      max-width: 670px;
      margin: 20px auto 28px;
      font-family: Arial, sans-serif;
      color: rgba(255,255,255,0.88);
      line-height: 1.8;
    }

    /* BOOKING MODAL */

    .booking-modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(12,29,27,0.78);
      backdrop-filter: blur(8px);
    }

    .booking-modal.open {
      display: flex;
    }

    .booking-card {
      position: relative;
      width: min(610px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      background: #fffdf8;
      border-radius: 24px;
      padding: 48px 38px 38px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.35);
      text-align: center;
    }

    .booking-close {
      position: absolute;
      right: 18px;
      top: 15px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #ded8cd;
      background: white;
      color: #264b46;
      font-size: 24px;
      cursor: pointer;
    }

    .booking-kicker {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      color: #b8733f;
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .booking-card h2 {
      color: #264b46;
      font-size: clamp(35px,7vw,50px);
      line-height: 1.08;
      font-weight: 400;
    }

    .booking-intro {
      max-width: 470px;
      margin: 16px auto 28px;
      color: #66736f;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }

    .payment-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .payment-option {
      border: 1px solid #e5ddd0;
      background: white;
      border-radius: 16px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .payment-option.featured {
      border: 2px solid #dab36f;
      background: #fffaf1;
    }

    .payment-label {
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9c7045;
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .payment-option h3 {
      font-size: 22px;
      color: #264b46;
      margin-bottom: 5px;
    }

    .payment-price {
      font-size: 32px;
      color: #
